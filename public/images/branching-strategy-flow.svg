<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="bsf-title">
  <title id="bsf-title">The branching flow: feature branches integrate in dev, selected work assembles into a release, one build promotes through the environments, and the baseline reconciles back into main</title>
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#070a10" />
  <g fill="#2a303f" opacity="0.35">
    <!-- grid dots -->
    <g id="dotrow">
      <circle cx="20" cy="20" r="1.1"/><circle cx="60" cy="20" r="1.1"/><circle cx="100" cy="20" r="1.1"/><circle cx="140" cy="20" r="1.1"/><circle cx="180" cy="20" r="1.1"/><circle cx="220" cy="20" r="1.1"/><circle cx="260" cy="20" r="1.1"/><circle cx="300" cy="20" r="1.1"/><circle cx="340" cy="20" r="1.1"/><circle cx="380" cy="20" r="1.1"/><circle cx="420" cy="20" r="1.1"/><circle cx="460" cy="20" r="1.1"/><circle cx="500" cy="20" r="1.1"/><circle cx="540" cy="20" r="1.1"/><circle cx="580" cy="20" r="1.1"/><circle cx="620" cy="20" r="1.1"/><circle cx="660" cy="20" r="1.1"/><circle cx="700" cy="20" r="1.1"/><circle cx="740" cy="20" r="1.1"/><circle cx="780" cy="20" r="1.1"/><circle cx="820" cy="20" r="1.1"/><circle cx="860" cy="20" r="1.1"/><circle cx="900" cy="20" r="1.1"/><circle cx="940" cy="20" r="1.1"/><circle cx="980" cy="20" r="1.1"/><circle cx="1020" cy="20" r="1.1"/><circle cx="1060" cy="20" r="1.1"/><circle cx="1100" cy="20" r="1.1"/><circle cx="1140" cy="20" r="1.1"/><circle cx="1180" cy="20" r="1.1"/><circle cx="1220" cy="20" r="1.1"/><circle cx="1260" cy="20" r="1.1"/>
    </g>
    <use href="#dotrow" y="40"/><use href="#dotrow" y="80"/><use href="#dotrow" y="120"/><use href="#dotrow" y="160"/><use href="#dotrow" y="200"/><use href="#dotrow" y="240"/><use href="#dotrow" y="280"/><use href="#dotrow" y="320"/><use href="#dotrow" y="360"/><use href="#dotrow" y="400"/><use href="#dotrow" y="440"/><use href="#dotrow" y="480"/><use href="#dotrow" y="520"/><use href="#dotrow" y="560"/><use href="#dotrow" y="600"/><use href="#dotrow" y="640"/>
  </g>

  <!-- the handoff divider -->
  <path d="M 892 30 V 690" stroke="#2a303f" stroke-width="2" stroke-dasharray="5 9" fill="none"/>

  <!-- zone brackets -->
  <g stroke="#969dad" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M 44 698 v 9 H 852 v -9"/>
    <path d="M 928 698 v 9 H 1250 v -9"/>
  </g>
  <text x="448" y="740" text-anchor="middle" fill="#969dad" font-size="20" letter-spacing="4">DEVELOPMENT TEAM</text>
  <text x="1089" y="740" text-anchor="middle" fill="#969dad" font-size="20" letter-spacing="4">APP SUPPORT</text>

  <!-- ==================== main ==================== -->
  <g>
    <path d="M 44 640 H 1240" stroke="#4aa8ff" stroke-width="9" opacity="0.16" stroke-linecap="round"/>
    <path d="M 44 640 H 1240" stroke="#4aa8ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="46" y="676" fill="#969dad" font-size="22">main</text>

  <!-- main merged into dev: integration includes what production runs -->
  <path d="M 280 640 C 305 430, 296 130, 360 90" stroke="#4aa8ff" stroke-width="7" opacity="0.13" fill="none"/>
  <path d="M 280 640 C 305 430, 296 130, 360 90" stroke="#4aa8ff" stroke-width="2.4" opacity="0.8" fill="none"/>

  <!-- ==================== dev ==================== -->
  <g>
    <path d="M 340 90 H 748" stroke="#ad80eb" stroke-width="9" opacity="0.16" stroke-linecap="round"/>
    <path d="M 340 90 H 748" stroke="#ad80eb" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="330" y="97" text-anchor="end" fill="#ebedf3" font-size="24">dev</text>
  <circle cx="360" cy="90" r="8" fill="#ad80eb" opacity="0.25"/>
  <circle cx="360" cy="90" r="5.5" fill="#070a10" stroke="#ad80eb" stroke-width="2.5"/>
  <!-- DEV environment chip, auto-deployed -->
  <path d="M 753 90 L 762 90 M 757 84 L 764 90 L 757 96" stroke="#ad80eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="768" y="68" width="104" height="44" rx="9" fill="rgba(173,128,235,0.12)" stroke="#ad80eb" stroke-width="2.5"/>
  <text x="820" y="98" text-anchor="middle" fill="#ad80eb" font-size="22" font-weight="600">DEV</text>
  <text x="820" y="136" text-anchor="middle" fill="#969dad" font-size="15">auto-deploy</text>

  <!-- ==================== feature branches ==================== -->
  <!-- feat/4311 -->
  <path d="M 70 640 C 95 480, 90 240, 160 200 H 600" stroke="#4aa8ff" stroke-width="8" opacity="0.14" fill="none"/>
  <path d="M 70 640 C 95 480, 90 240, 160 200 H 600" stroke="#4aa8ff" stroke-width="2.6" fill="none"/>
  <text x="164" y="182" fill="#969dad" font-size="19">feat/4311</text>
  <!-- feat/4312 -->
  <path d="M 140 640 C 165 510, 160 305, 230 270 H 620" stroke="#4aa8ff" stroke-width="8" opacity="0.14" fill="none"/>
  <path d="M 140 640 C 165 510, 160 305, 230 270 H 620" stroke="#4aa8ff" stroke-width="2.6" fill="none"/>
  <text x="234" y="252" fill="#969dad" font-size="19">feat/4312</text>
  <!-- feat/4313 -->
  <path d="M 210 640 C 235 530, 230 372, 300 340 H 640" stroke="#4aa8ff" stroke-width="8" opacity="0.14" fill="none"/>
  <path d="M 210 640 C 235 530, 230 372, 300 340 H 640" stroke="#4aa8ff" stroke-width="2.6" fill="none"/>
  <text x="304" y="322" fill="#969dad" font-size="19">feat/4313</text>

  <!-- all three integrate into dev -->
  <path d="M 600 200 C 655 200, 640 90, 692 90" stroke="#4aa8ff" stroke-width="2.2" opacity="0.85" fill="none"/>
  <path d="M 620 270 C 685 270, 662 90, 722 90" stroke="#4aa8ff" stroke-width="2.2" opacity="0.85" fill="none"/>
  <path d="M 640 340 C 712 340, 692 90, 744 90" stroke="#4aa8ff" stroke-width="2.2" opacity="0.85" fill="none"/>

  <!-- 4311 and 4312 are selected into the release -->
  <path d="M 420 200 C 470 240, 452 420, 506 458" stroke="#2fe39b" stroke-width="2.2" opacity="0.85" fill="none"/>
  <path d="M 470 270 C 520 302, 502 430, 546 458" stroke="#2fe39b" stroke-width="2.2" opacity="0.85" fill="none"/>

  <!-- feature commits -->
  <g fill="#070a10" stroke="#4aa8ff" stroke-width="2.4">
    <circle cx="240" cy="200" r="6"/><circle cx="420" cy="200" r="6"/>
    <circle cx="300" cy="270" r="6"/><circle cx="470" cy="270" r="6"/>
    <circle cx="370" cy="340" r="6"/><circle cx="520" cy="340" r="6"/>
  </g>

  <!-- ==================== release ==================== -->
  <g>
    <path d="M 340 460 H 688" stroke="#2fe39b" stroke-width="9" opacity="0.16" stroke-linecap="round"/>
    <path d="M 340 460 H 688" stroke="#2fe39b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="330" y="467" text-anchor="end" fill="#ebedf3" font-size="22">release/REL-123</text>
  <g fill="#070a10" stroke="#2fe39b" stroke-width="2.4">
    <circle cx="506" cy="460" r="6"/><circle cx="546" cy="460" r="6"/>
  </g>

  <!-- pipeline builds once -->
  <path d="M 692 460 L 700 460 M 695 454 L 702 460 L 695 466" stroke="#2fe39b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="731,432 755,446 755,474 731,488 707,474 707,446" fill="rgba(47,227,155,0.08)" stroke="#2fe39b" stroke-width="2.5"/>
  <circle cx="731" cy="460" r="5" fill="#2fe39b"/>
  <text x="731" y="512" text-anchor="middle" fill="#969dad" font-size="15">pipeline</text>
  <path d="M 760 460 L 768 460 M 763 454 L 770 460 L 763 466" stroke="#2fe39b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="774" y="438" width="102" height="44" rx="9" fill="#070a10" stroke="#2fe39b" stroke-width="2.8"/>
  <text x="825" y="468" text-anchor="middle" fill="#2fe39b" font-size="24" font-weight="700">18427</text>
  <text x="825" y="512" text-anchor="middle" fill="#969dad" font-size="15">build once</text>

  <!-- ==================== promotion: the same artifact ==================== -->
  <path d="M 880 460 L 906 460 M 899 453 L 908 460 L 899 467" stroke="#2fe39b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="912" y="438" width="96" height="44" rx="9" fill="rgba(47,227,155,0.10)" stroke="#2fe39b" stroke-width="2"/>
    <text x="960" y="468" text-anchor="middle" fill="#2fe39b" font-size="22" font-weight="600">QA</text>
    <text x="960" y="510" text-anchor="middle" fill="#969dad" font-size="15">18427</text>
  </g>
  <path d="M 1012 460 L 1036 460 M 1029 453 L 1038 460 L 1029 467" stroke="#2fe39b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="1042" y="438" width="96" height="44" rx="9" fill="rgba(47,227,155,0.10)" stroke="#2fe39b" stroke-width="2"/>
    <text x="1090" y="468" text-anchor="middle" fill="#2fe39b" font-size="22" font-weight="600">UAT</text>
    <text x="1090" y="510" text-anchor="middle" fill="#969dad" font-size="15">18427</text>
  </g>
  <path d="M 1142 460 L 1166 460 M 1159 453 L 1168 460 L 1159 467" stroke="#2fe39b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="1172" y="438" width="94" height="44" rx="9" fill="rgba(47,227,155,0.18)" stroke="#2fe39b" stroke-width="3"/>
    <text x="1219" y="468" text-anchor="middle" fill="#2fe39b" font-size="22" font-weight="700">PROD</text>
    <text x="1219" y="510" text-anchor="middle" fill="#969dad" font-size="15">18427</text>
  </g>

  <!-- reconcile the shipped source into main's tip -->
  <path d="M 1214 486 C 1224 545, 1222 590, 1213 622" stroke="#2fe39b" stroke-width="7" opacity="0.13" fill="none"/>
  <path d="M 1214 486 C 1224 545, 1222 590, 1213 622" stroke="#2fe39b" stroke-width="2.4" fill="none"/>
  <path d="M 1206 618 L 1213 628 L 1220 618" stroke="#2fe39b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1200" y="566" text-anchor="end" fill="#969dad" font-size="15">reconcile</text>

  <!-- a release still in flight gets the retrofit -->
  <g opacity="0.5">
    <path d="M 470 550 H 868" stroke="#2fe39b" stroke-width="8" opacity="0.16" stroke-linecap="round"/>
    <path d="M 470 550 H 868" stroke="#2fe39b" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="462" y="557" text-anchor="end" fill="#969dad" font-size="19">release/REL-124</text>
  <path d="M 840 640 C 856 612, 852 582, 862 560" stroke="#4aa8ff" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  <path d="M 854 562 L 863 556 L 863 567" stroke="#4aa8ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="836" y="600" text-anchor="end" fill="#969dad" font-size="15">retrofit PR</text>

  <!-- main commits, above everything crossing the lane -->
  <g fill="#070a10" stroke="#4aa8ff" stroke-width="2.6">
    <circle cx="70" cy="640" r="7"/><circle cx="140" cy="640" r="7"/><circle cx="210" cy="640" r="7"/><circle cx="280" cy="640" r="7"/><circle cx="560" cy="640" r="7"/><circle cx="840" cy="640" r="7"/>
  </g>
  <circle cx="1213" cy="640" r="11" fill="#2fe39b" opacity="0.22"/>
  <circle cx="1213" cy="640" r="8" fill="#070a10" stroke="#2fe39b" stroke-width="3"/>
</svg>
