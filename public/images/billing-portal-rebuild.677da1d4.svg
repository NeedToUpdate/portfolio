<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Billing portal end-state architecture</title>
  <desc id="desc">A customer uses a containerized Next.js portal on Azure App Service with billing and service sections. A thin owned integration layer connects it to the unchanged legacy CRM and billing system. A dashed boundary marks end-to-end tracing flowing into App Insights.</desc>

  <defs>
    <marker id="chev" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#deba6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#121723"/>
      <path d="M0 0 V8" stroke="#2a3145" stroke-width="2"/>
    </pattern>
    <style>
      .stage { fill: #121723; stroke: #3a4358; stroke-width: 2; }
      .hatch { fill: url(#hatch); stroke: #3a4358; stroke-width: 2; }
      .gold { fill: #171b26; stroke: #deba6c; stroke-width: 2.25; }
      .cyan { fill: #101a23; stroke: #60cdd8; stroke-width: 2.25; }
      .head { fill: #ebedf3; font: 700 18px Arial, sans-serif; }
      .label { fill: #ebedf3; font: 700 16px Arial, sans-serif; }
      .small { fill: #aab1c0; font: 13px Arial, sans-serif; }
      .line { stroke: #deba6c; stroke-width: 2.25; fill: none; marker-end: url(#chev); }
      .person { stroke: #ebedf3; stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .trace { stroke: #687085; stroke-width: 1.8; fill: none; stroke-dasharray: 7 7; }
      .brace { stroke: #deba6c; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="620" rx="16" fill="#151924"/>
  <rect x="10" y="10" width="1260" height="600" rx="16" fill="#151924" stroke="#2a303f"/>

  <text x="54" y="58" fill="#ebedf3" font-family="Arial, sans-serif" font-size="27" font-weight="700">Billing portal rebuild</text>
  <text x="54" y="88" fill="#aab1c0" font-family="Arial, sans-serif" font-size="15">One containerized Next.js portal, a thin owned integration layer, and the legacy systems left unchanged.</text>

  <rect class="trace" x="80" y="118" width="800" height="360" rx="14"/>
  <text class="small" x="872" y="140" text-anchor="end">Traced end to end</text>

  <circle class="person" cx="170" cy="240" r="24"/>
  <path class="person" d="M122 318 C122 262 218 262 218 318"/>
  <text class="label" x="170" y="360" text-anchor="middle">Customer</text>
  <text class="small" x="170" y="384" text-anchor="middle">250K monthly</text>
  <path class="line" d="M238 268 H296"/>

  <rect class="gold" x="310" y="150" width="420" height="300" rx="16"/>
  <text class="head" x="520" y="188" text-anchor="middle">Customer portal</text>
  <text class="small" x="520" y="212" text-anchor="middle">Next.js, containerized on Azure App Service</text>
  <rect class="stage" x="340" y="252" width="180" height="150" rx="12"/>
  <text class="label" x="430" y="333" text-anchor="middle">Billing</text>
  <rect class="stage" x="520" y="252" width="180" height="150" rx="12"/>
  <text class="label" x="610" y="333" text-anchor="middle">Service</text>

  <path class="line" d="M736 300 H778"/>

  <rect class="cyan" x="790" y="170" width="60" height="260" rx="10"/>
  <text class="label" transform="rotate(-90 820 300)" x="820" y="305" text-anchor="middle">Integration layer</text>
  <text class="small" x="820" y="452" text-anchor="middle">Owned, reusable</text>

  <rect class="hatch" x="960" y="160" width="250" height="110" rx="12"/>
  <text class="label" x="1085" y="207" text-anchor="middle">Legacy CRM</text>
  <text class="small" x="1085" y="235" text-anchor="middle">Unchanged</text>
  <path class="line" d="M856 215 H952"/>

  <rect class="hatch" x="960" y="330" width="250" height="110" rx="12"/>
  <text class="label" x="1085" y="377" text-anchor="middle">Billing system</text>
  <text class="small" x="1085" y="405" text-anchor="middle">Unchanged</text>
  <path class="line" d="M856 385 H952"/>

  <path class="brace" d="M80,482 Q80,496 94,496 L466,496 Q480,496 480,510 Q480,496 494,496 L866,496 Q880,496 880,482"/>
  <path class="brace" d="M480 510 V524"/>

  <rect class="cyan" x="370" y="524" width="220" height="76" rx="12"/>
  <text class="label" x="480" y="556" text-anchor="middle">App Insights</text>
  <text class="small" x="480" y="580" text-anchor="middle">Traces, logs, alerts</text>
</svg>
