name: Deploy Prod

on:
  push:
    branches:
      - main

# A prod deploy is never cancelled halfway; the next one waits its turn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      stage: prod
      host: artnikitin.dev
    secrets: inherit
