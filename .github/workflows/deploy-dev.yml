name: Deploy Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      stage: dev
      host: dev.artnikitin.dev
    secrets: inherit
